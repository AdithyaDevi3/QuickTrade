spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

# Polygon.io API key — set via POLYGON_API_KEY env var or .env file
polygon:
  api-key: ${POLYGON_API_KEY}

# JWT signing secret — set via JWT_SECRET env var or .env file (must be >= 256 bits for HS256)
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes-min}
  expiration-ms: 604800000
